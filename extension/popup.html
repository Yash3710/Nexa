<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">N</div>
      <div>
        <div class="brand">Nexa</div>
        <div class="tagline">Meeting Capture</div>
      </div>
    </div>

    <!-- Status Bar (shown when recording) -->
    <div id="recording-bar" class="recording-bar hidden">
      <div class="rec-dot"></div>
      <span id="rec-timer">00:00</span>
      <span class="rec-label">Recording...</span>
    </div>

    <!-- Setup Form (shown when NOT recording) -->
    <div id="setup-form">
      <div class="field">
        <label>Project</label>
        <select id="project-select">
          <option value="">Loading projects...</option>
        </select>
      </div>
      <div class="field">
        <label>Meeting Title <span class="optional">(optional)</span></label>
        <input type="text" id="meeting-title" placeholder="e.g. Weekly Sync">
      </div>
    </div>

    <!-- Action Buttons -->
    <button id="start-btn" class="btn btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
      Start Recording
    </button>
    <button id="stop-btn" class="btn btn-danger hidden">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor"/></svg>
      Stop & Analyze
    </button>

    <!-- Processing State -->
    <div id="processing" class="status-card hidden">
      <div class="spinner"></div>
      <span id="processing-text">Processing...</span>
    </div>

    <!-- Success State -->
    <div id="success" class="status-card success hidden">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <span>Meeting analyzed!</span>
      <a id="view-meeting-link" href="#" target="_blank" class="link">View MoM →</a>
    </div>

    <!-- Error State -->
    <div id="error" class="status-card error hidden">
      <span id="error-text"></span>
      <button id="retry-btn" class="btn-small">Retry</button>
    </div>

    <!-- Footer -->
    <div class="footer">
      <a href="http://localhost:3000/projects" target="_blank">Open Nexa Dashboard</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
